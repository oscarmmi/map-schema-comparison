<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Schema Comparison Tool</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
        }
        h1 {
            color: #569cd6;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .file-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-input-wrapper label {
            color: #9cdcfe;
        }
        input[type="file"] {
            background: #2d2d2d;
            color: #d4d4d4;
            padding: 8px 12px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="file"]::file-selector-button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 8px;
        }
        input[type="file"]::file-selector-button:hover {
            background: #1177bb;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #3c3c3c;
            cursor: not-allowed;
        }
        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #252526;
            border-radius: 6px;
            flex-wrap: wrap;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-item .icon {
            font-size: 1.1rem;
        }
        .summary-item .count {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .matched { color: #4ec9b0; }
        .added { color: #89d185; }
        .removed { color: #f48771; }
        .modified { color: #dcdcaa; }
        .tree-container {
            background: #252526;
            border-radius: 6px;
            padding: 16px;
            max-height: calc(100vh - 200px);
            overflow: auto;
        }
        .tree-node {
            margin-left: 20px;
            line-height: 1.6;
        }
        .children > .tree-node {
            margin-left: 20px;
        }
        .tree-container > .tree-node {
            margin-left: 0;
        }
        .node-header {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .node-header:hover {
            background: #2a2d2e;
        }
        .node-toggle {
            width: 16px;
            display: inline-block;
            text-align: center;
            color: #858585;
            font-size: 0.8rem;
        }
        .node-key {
            color: #9cdcfe;
        }
        .node-value {
            color: #ce9178;
        }
        .node-value.modified {
            background: #5a4a00;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .node-type {
            color: #4ec9b0;
            font-size: 0.8rem;
        }
        .node-path {
            color: #6a9955;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        .children {
            display: none;
        }
        .children.expanded {
            display: block;
        }
        .status-icon {
            margin-left: 4px;
        }
        .no-files {
            color: #858585;
            text-align: center;
            padding: 40px;
        }
        .file-info {
            color: #858585;
            font-size: 0.85rem;
            margin-left: 10px;
        }
        .sub-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #252526;
            border-radius: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
        }
        .search-box input {
            width: 100%;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .filters {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .filter-item input {
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-small {
            padding: 6px 12px !important;
            font-size: 12px !important;
            background: #3c3c3c !important;
        }
        .btn-small:hover {
            background: #4c4c4c !important;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <h1>JSON Schema Comparison Tool</h1>
    
    <div class="controls">
        <div class="file-input-wrapper">
            <label>File 1:</label>
            <input type="file" id="file1" accept=".json">
            <span class="file-info" id="file1Info"></span>
        </div>
        <div class="file-input-wrapper">
            <label>File 2:</label>
            <input type="file" id="file2" accept=".json">
            <span class="file-info" id="file2Info"></span>
        </div>
        <button id="compareBtn" disabled>Compare</button>
    </div>

    <div class="summary" id="summary" style="display: none;">
        <div class="summary-item matched">
            <span class="icon">✓</span>
            <span class="count" id="matchedCount">0</span>
            <span>Matched</span>
        </div>
        <div class="summary-item added">
            <span class="icon">+</span>
            <span class="count" id="addedCount">0</span>
            <span>Added</span>
        </div>
        <div class="summary-item removed">
            <span class="icon">-</span>
            <span class="count" id="removedCount">0</span>
            <span>Removed</span>
        </div>
        <div class="summary-item modified">
            <span class="icon">~</span>
            <span class="count" id="modifiedCount">0</span>
            <span>Modified</span>
        </div>
    </div>

    <div class="sub-controls" id="subControls" style="display: none;">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search keys or values...">
        </div>
        <div class="filters">
            <label class="filter-item matched">
                <input type="checkbox" id="filterMatched" checked> Matched
            </label>
            <label class="filter-item added">
                <input type="checkbox" id="filterAdded" checked> Added
            </label>
            <label class="filter-item removed">
                <input type="checkbox" id="filterRemoved" checked> Removed
            </label>
            <label class="filter-item modified">
                <input type="checkbox" id="filterModified" checked> Modified
            </label>
        </div>
        <div class="action-buttons">
            <button id="expandAllBtn" class="btn-small">Expand All</button>
            <button id="collapseAllBtn" class="btn-small">Collapse All</button>
            <button id="exportBtn" class="btn-small">Export JSON</button>
        </div>
    </div>

    <div class="tree-container" id="treeContainer">
        <div class="no-files">Select two JSON files and click Compare to see differences</div>
    </div>

    <script>
        const IGNORED_FIELDS = ['modifiers'];

        let json1 = null;
        let json2 = null;
        let diffResult = null;

        const file1Input = document.getElementById('file1');
        const file2Input = document.getElementById('file2');
        const compareBtn = document.getElementById('compareBtn');
        const summaryEl = document.getElementById('summary');
        const subControlsEl = document.getElementById('subControls');
        const searchInput = document.getElementById('searchInput');
        const filterMatched = document.getElementById('filterMatched');
        const filterAdded = document.getElementById('filterAdded');
        const filterRemoved = document.getElementById('filterRemoved');
        const filterModified = document.getElementById('filterModified');
        const expandAllBtn = document.getElementById('expandAllBtn');
        const collapseAllBtn = document.getElementById('collapseAllBtn');
        const exportBtn = document.getElementById('exportBtn');
        const treeContainer = document.getElementById('treeContainer');

        file1Input.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file1Info').textContent = file.name;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        json1 = JSON.parse(e.target.result);
                        checkReady();
                    } catch (err) {
                        alert('Error parsing File 1: ' + err.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        file2Input.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file2Info').textContent = file.name;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        json2 = JSON.parse(e.target.result);
                        checkReady();
                    } catch (err) {
                        alert('Error parsing File 2: ' + err.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        function checkReady() {
            compareBtn.disabled = !(json1 && json2);
        }

        compareBtn.addEventListener('click', () => {
            diffResult = compareJson(json1, json2, '');
            renderDiff(diffResult);
            updateSummary(diffResult);
        });

        searchInput.addEventListener('input', applyFilters);
        [filterMatched, filterAdded, filterRemoved, filterModified].forEach(el => {
            el.addEventListener('change', applyFilters);
        });

        expandAllBtn.addEventListener('click', () => {
            document.querySelectorAll('.children').forEach(el => {
                el.classList.add('expanded');
            });
            document.querySelectorAll('.node-toggle').forEach(el => {
                if (el.textContent === '▶') el.textContent = '▼';
            });
        });

        collapseAllBtn.addEventListener('click', () => {
            document.querySelectorAll('.children').forEach(el => {
                if (!el.parentElement.classList.contains('tree-container')) {
                    el.classList.remove('expanded');
                }
            });
            document.querySelectorAll('.node-toggle').forEach(el => {
                if (el.textContent === '▼') el.textContent = '▶';
            });
        });

        exportBtn.addEventListener('click', () => {
            if (!diffResult) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(diffResult, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "diff_result.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });

        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const showMatched = filterMatched.checked;
            const showAdded = filterAdded.checked;
            const showRemoved = filterRemoved.checked;
            const showModified = filterModified.checked;

            const nodes = treeContainer.querySelectorAll('.tree-node');
            
            nodes.forEach(node => {
                node.classList.add('hidden');
            });

            nodes.forEach(node => {
                const header = node.querySelector(':scope > .node-header');
                const statusIcon = header.querySelector('.status-icon');
                const text = header.textContent.toLowerCase();
                
                let matchesStatus = false;
                if (statusIcon) {
                    if (statusIcon.classList.contains('matched') && showMatched) matchesStatus = true;
                    if (statusIcon.classList.contains('added') && showAdded) matchesStatus = true;
                    if (statusIcon.classList.contains('removed') && showRemoved) matchesStatus = true;
                    if (statusIcon.classList.contains('modified') && showModified) matchesStatus = true;
                }

                const matchesQuery = query ? text.includes(query) : true;

                if (matchesStatus && matchesQuery) {
                    node.classList.remove('hidden');
                } else if (!statusIcon && query && text.includes(query)) {
                    node.classList.remove('hidden');
                }
            });

            // Ensure parents of visible nodes are visible
            let hasVisible = true;
            while (hasVisible) {
                hasVisible = false;
                treeContainer.querySelectorAll('.tree-node:not(.hidden)').forEach(node => {
                    let parent = node.parentElement.closest('.tree-node');
                    if (parent && parent.classList.contains('hidden')) {
                        parent.classList.remove('hidden');
                        hasVisible = true;
                    }
                });
            }
        }

        function updateSummary(diff) {
            summaryEl.style.display = 'flex';
            subControlsEl.style.display = 'flex';
            document.getElementById('matchedCount').textContent = diff.stats.matched;
            document.getElementById('addedCount').textContent = diff.stats.added;
            document.getElementById('removedCount').textContent = diff.stats.removed;
            document.getElementById('modifiedCount').textContent = diff.stats.modified;
            applyFilters();
        }

        function compareJson(obj1, obj2, path) {
            const result = {
                type: 'root',
                path: path,
                stats: { matched: 0, added: 0, removed: 0, modified: 0 },
                children: []
            };

            if (obj1 === obj2) {
                result.type = 'equal';
                result.value = obj1;
                result.stats.matched++;
                return result;
            }

            if (obj1 === null || obj2 === null) {
                result.type = obj1 === null ? 'added' : 'removed';
                result.value = obj1 !== null ? obj1 : obj2;
                if (obj1 === null) result.stats.added++;
                else result.stats.removed++;
                return result;
            }

            const type1 = Array.isArray(obj1) ? 'array' : typeof obj1;
            const type2 = Array.isArray(obj2) ? 'array' : typeof obj2;

            if (type1 !== type2) {
                result.type = 'modified';
                result.oldValue = obj1;
                result.newValue = obj2;
                result.stats.modified++;
                return result;
            }

            if (type1 === 'object') {
                result.type = 'object';
                result.isProductCodeArray = Array.isArray(obj1) || Array.isArray(obj2);
                const keys1 = Object.keys(obj1);
                const keys2 = Object.keys(obj2);
                const allKeys = new Set([...keys1, ...keys2]);

                for (const key of allKeys) {
                    if (IGNORED_FIELDS.includes(key)) {
                        continue;
                    }
                    const childPath = path ? `${path}.${key}` : key;
                    if (!keys1.includes(key)) {
                        const addedNode = {
                            type: 'added',
                            key: key,
                            path: childPath,
                            value: obj2[key],
                            inBoth: false,
                            recordCount: Array.isArray(obj2[key]) ? obj2[key].length : null,
                            stats: { matched: 0, added: 1, removed: 0, modified: 0 }
                        };
                        result.children.push(addedNode);
                        result.stats.added++;
                    } else if (!keys2.includes(key)) {
                        const removedNode = {
                            type: 'removed',
                            key: key,
                            path: childPath,
                            value: obj1[key],
                            inBoth: false,
                            recordCount: Array.isArray(obj1[key]) ? obj1[key].length : null,
                            stats: { matched: 0, added: 0, removed: 1, modified: 0 }
                        };
                        result.children.push(removedNode);
                        result.stats.removed++;
                    } else {
                        const childResult = compareJson(obj1[key], obj2[key], childPath);
                        childResult.key = key;
                        childResult.inBoth = true;
                        childResult.recordCount = Array.isArray(obj2[key]) ? obj2[key].length : null;
                        result.children.push(childResult);
                        result.stats.matched += childResult.stats.matched;
                        result.stats.added += childResult.stats.added;
                        result.stats.removed += childResult.stats.removed;
                        result.stats.modified += childResult.stats.modified;
                    }
                }
            } else if (type1 === 'array') {
                result.type = 'array';
                
                const findCommonIdKey = (arr) => {
                    const idKeys = ['id', 'name', 'code', 'key', 'uuid'];
                    for (const item of arr) {
                        if (item && typeof item === 'object') {
                            for (const key of idKeys) {
                                if (key in item) return key;
                            }
                        }
                    }
                    return null;
                };

                const idKey1 = findCommonIdKey(obj1);
                const idKey2 = findCommonIdKey(obj2);
                const idKey = idKey1 === idKey2 ? idKey1 : (idKey1 || idKey2);

                if (idKey && obj1.every(i => i && typeof i === 'object') && obj2.every(i => i && typeof i === 'object')) {
                    const map1 = new Map(obj1.map((item, index) => [item[idKey], {item, index}]));
                    const map2 = new Map(obj2.map((item, index) => [item[idKey], {item, index}]));
                    
                    const allIds = new Set([...map1.keys(), ...map2.keys()]);
                    
                    for (const id of allIds) {
                        const val1 = map1.get(id);
                        const val2 = map2.get(id);
                        
                        if (!val1) {
                            const childPath = `${path}[${val2.index}]`;
                            const addedNode = {
                                type: 'added',
                                key: `[${val2.index}] (${idKey}:${id})`,
                                path: childPath,
                                value: val2.item,
                                stats: { matched: 0, added: 1, removed: 0, modified: 0 }
                            };
                            result.children.push(addedNode);
                            result.stats.added++;
                        } else if (!val2) {
                            const childPath = `${path}[${val1.index}]`;
                            const removedNode = {
                                type: 'removed',
                                key: `[${val1.index}] (${idKey}:${id})`,
                                path: childPath,
                                value: val1.item,
                                stats: { matched: 0, added: 0, removed: 1, modified: 0 }
                            };
                            result.children.push(removedNode);
                            result.stats.removed++;
                        } else {
                            const childPath = `${path}[${val1.index}->${val2.index}]`;
                            const childResult = compareJson(val1.item, val2.item, childPath);
                            childResult.key = `[${val1.index}] (${idKey}:${id})`;
                            result.children.push(childResult);
                            result.stats.matched += childResult.stats.matched;
                            result.stats.added += childResult.stats.added;
                            result.stats.removed += childResult.stats.removed;
                            result.stats.modified += childResult.stats.modified;
                        }
                    }
                } else {
                    const maxLen = Math.max(obj1.length, obj2.length);
                    
                    for (let i = 0; i < maxLen; i++) {
                        const childPath = `${path}[${i}]`;
                        if (i >= obj1.length) {
                            const addedNode = {
                                type: 'added',
                                key: i,
                                path: childPath,
                                value: obj2[i],
                                stats: { matched: 0, added: 1, removed: 0, modified: 0 }
                            };
                            result.children.push(addedNode);
                            result.stats.added++;
                        } else if (i >= obj2.length) {
                            const removedNode = {
                                type: 'removed',
                                key: i,
                                path: childPath,
                                value: obj1[i],
                                stats: { matched: 0, added: 0, removed: 1, modified: 0 }
                            };
                            result.children.push(removedNode);
                            result.stats.removed++;
                        } else {
                            const childResult = compareJson(obj1[i], obj2[i], childPath);
                            childResult.key = i;
                            result.children.push(childResult);
                            result.stats.matched += childResult.stats.matched;
                            result.stats.added += childResult.stats.added;
                            result.stats.removed += childResult.stats.removed;
                            result.stats.modified += childResult.stats.modified;
                        }
                    }
                }
            } else {
                if (typeof obj1 === 'number' && typeof obj2 === 'number') {
                    if (obj1 !== obj2) {
                        result.type = 'modified';
                        result.oldValue = obj1;
                        result.newValue = obj2;
                        result.stats.modified++;
                    } else {
                        result.type = 'equal';
                        result.value = obj1;
                        result.stats.matched++;
                    }
                } else {
                    result.type = obj1 === obj2 ? 'equal' : 'modified';
                    result.oldValue = obj1;
                    result.newValue = obj2;
                    if (obj1 === obj2) {
                        result.stats.matched++;
                    } else {
                        result.stats.modified++;
                    }
                }
            }

            return result;
        }

        function renderDiff(diff, isRoot = true) {
            if (isRoot && diff.type === 'equal') {
                treeContainer.innerHTML = '<div class="no-files">Files are identical</div>';
                return;
            }

            treeContainer.innerHTML = '';
            treeContainer.appendChild(renderNode(diff, 0, isRoot));
        }

        function renderNode(node, depth, isRoot = false) {
            const container = document.createElement('div');
            container.className = 'tree-node';

            if (node.type === 'equal') {
                const value = formatValue(node.value);
                container.innerHTML = `
                    <span class="node-header">
                        <span class="node-toggle"></span>
                        <span class="node-key">${isRoot ? 'Root' : node.key}</span>
                        <span class="node-value">${value}</span>
                        <span class="status-icon matched">✓</span>
                    </span>`;
                return container;
            }

            if (node.type === 'modified') {
                const oldStr = formatValue(node.oldValue, true);
                const newStr = formatValue(node.newValue, true);
                container.innerHTML = `
                    <span class="node-header">
                        <span class="node-toggle"></span>
                        <span class="node-key">${node.key}</span>
                        <span class="node-value modified">${oldStr} → ${newStr}</span>
                        <span class="status-icon modified">~</span>
                        <span class="node-path">${node.path}</span>
                    </span>`;
                return container;
            }

            if (node.type === 'added' || node.type === 'removed') {
                const value = formatValue(node.value, true);
                const statusClass = node.type;
                const statusIcon = node.type === 'added' ? '+' : '-';
                container.innerHTML = `
                    <span class="node-header">
                        <span class="node-toggle"></span>
                        <span class="node-key">${node.key}</span>
                        <span class="node-value">${value}</span>
                        <span class="status-icon ${statusClass}">${statusIcon}</span>
                        <span class="node-path">${node.path}</span>
                    </span>`;
                return container;
            }

            if (node.type === 'object' || node.type === 'array') {
                const typeIcon = node.type === 'object' ? '📁' : '📋';
                const hasChildren = node.children && node.children.length > 0;
                const toggle = hasChildren ? '<span class="node-toggle" onclick="toggleNode(this)">▶</span>' : '<span class="node-toggle"></span>';
                
                container.innerHTML = `
                    <span class="node-header" onclick="toggleNode(this)">
                        ${toggle}
                        <span class="node-type">${typeIcon}</span>
                        <span class="node-key">${isRoot ? 'Root' : node.key}</span>
                        <span class="node-type">${node.type}</span>
                        ${!isRoot ? `<span class="node-path">${node.path}</span>` : ''}
                    </span>`;

                if (hasChildren) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'children';
                    
                    for (const child of node.children) {
                        childrenContainer.appendChild(renderNode(child, depth + 1));
                    }
                    
                    container.appendChild(childrenContainer);
                }
            }

            if (node.type === 'root') {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'children expanded';
                
                for (const child of node.children) {
                    childrenContainer.appendChild(renderNode(child, depth + 1));
                }
                
                container.appendChild(childrenContainer);
            }

            return container;
        }

        function formatValue(value, forDisplay = false) {
            if (value === null) return 'null';
            if (value === undefined) return 'undefined';
            
            const type = typeof value;
            
            if (type === 'object') {
                if (Array.isArray(value)) {
                    if (forDisplay) {
                        return `Array[${value.length}]`;
                    }
                    return `Array[${value.length}]`;
                }
                if (forDisplay) {
                    return '{...}';
                }
                return '{...}';
            }
            
            if (type === 'string') {
                return `"${value}"`;
            }
            
            if (type === 'number') {
                return String(value);
            }
            
            if (type === 'boolean') {
                return String(value);
            }
            
            return String(value);
        }

        function toggleNode(el) {
            const header = el.closest('.node-header');
            const node = header.closest('.tree-node');
            const children = node.querySelector(':scope > .children');
            const toggle = header.querySelector('.node-toggle');
            
            if (children) {
                if (children.classList.contains('expanded')) {
                    children.classList.remove('expanded');
                    toggle.textContent = '▶';
                } else {
                    children.classList.add('expanded');
                    toggle.textContent = '▼';
                }
            }
        }

        window.toggleNode = toggleNode;
    </script>
</body>
</html>
